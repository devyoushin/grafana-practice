# Grafana Helm values
# Chart: grafana/grafana
# 개발/테스트 환경용 values

# Admin 자격증명 (Secret 참조)
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# Grafana 설정
grafana.ini:
  server:
    root_url: http://grafana.monitoring.svc.cluster.local
  analytics:
    reporting_enabled: false
    check_for_updates: false
  log:
    mode: console
    level: info
  auth.anonymous:
    enabled: false

# 리소스
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# 데이터 영속성
persistence:
  enabled: true
  storageClassName: gp3
  size: 10Gi

# 서비스
service:
  type: ClusterIP
  port: 80

# 데이터소스 자동 프로비저닝
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus.monitoring.svc.cluster.local:9090
        access: proxy
        httpMethod: POST
        isDefault: true
        jsonData:
          timeInterval: "15s"
          queryTimeout: "60s"
        editable: false

      - name: Loki
        type: loki
        uid: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          maxLines: 1000
        editable: false

      # Mimir 사용 시 아래 주석 해제
      # - name: Mimir
      #   type: prometheus
      #   uid: mimir
      #   url: http://mimir-nginx.monitoring.svc.cluster.local/prometheus
      #   access: proxy
      #   httpMethod: POST
      #   jsonData:
      #     prometheusType: Mimir
      #     httpHeaderName1: X-Scope-OrgID
      #   secureJsonData:
      #     httpHeaderValue1: default
      #   editable: false

# 대시보드 프로바이더
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/default

# 커뮤니티 대시보드 자동 import
dashboards:
  default:
    node-exporter:
      gnetId: 1860
      revision: 37
      datasource: Prometheus

    kubernetes-cluster:
      gnetId: 15757
      revision: 37
      datasource: Prometheus

    kubernetes-namespace:
      gnetId: 15758
      revision: 34
      datasource: Prometheus

# sidecar (ConfigMap → 대시보드 자동 반영)
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folder: /tmp/dashboards
    searchNamespace: monitoring
    provider:
      allowUiUpdates: false
  datasources:
    enabled: false

# Grafana가 자기 자신의 메트릭을 노출하도록 설정
# (ServiceMonitor와 함께 사용)
serviceMonitor:
  enabled: false   # prometheus-operator 사용 시 true로 변경
