apiVersion: 1

datasources:
  # Prometheus
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus.monitoring.svc.cluster.local:9090
    access: proxy
    httpMethod: POST
    isDefault: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
    editable: false

  # Loki
  - name: Loki
    type: loki
    uid: loki
    url: http://loki.monitoring.svc.cluster.local:3100
    access: proxy
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: "(?:trace_id|traceID)=(\\w+)"
          url: "${__value.raw}"
          datasourceUid: tempo
    editable: false

  # Tempo (분산 트레이싱)
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo.monitoring.svc.cluster.local:3100
    access: proxy
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        customQuery: false
      tracesToMetrics:
        datasourceUid: prometheus
      lokiSearch:
        datasourceUid: loki
    editable: false

